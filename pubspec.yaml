name: skipit
description: SkipIt — VPN-клиент для Windows на ядрах Xray-core и sing-box.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

# Намеренно без сторонних пакетов: всё системное (реестр, процессы, диалоги)
# делается через dart:io / dart:ffi, чтобы сборка не зависела от плагинов.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/flags/
